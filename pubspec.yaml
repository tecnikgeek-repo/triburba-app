name: triburba
description: "triburba per Android e iPhone: il social dei quartieri. Ogni quartiere una voce, insieme una città. Software libero AGPL-3.0."
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  open_filex: ^4.7.0
  share_plus: ^13.3.1
  cached_network_image: ^4.0.5
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  # notifiche push istantanee (Firebase): attive solo quando il progetto ha google-services.json
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/licenze/COPYING-AGPL-3.0.txt
    - assets/img/
    - assets/emoji/

  # caratteri del sito triburba.it (OFL): Inter per i testi, Bricolage Grotesque per i titoli
  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/Inter-400.ttf
          weight: 400
        - asset: assets/font/Inter-500.ttf
          weight: 500
        - asset: assets/font/Inter-600.ttf
          weight: 600
        - asset: assets/font/Inter-700.ttf
          weight: 700
        - asset: assets/font/Inter-800.ttf
          weight: 800
    - family: Bricolage
      fonts:
        - asset: assets/font/Bricolage-600.ttf
          weight: 600
        - asset: assets/font/Bricolage-700.ttf
          weight: 700
        - asset: assets/font/Bricolage-800.ttf
          weight: 800

# icone dell'app (generate da assets/img/triburba-icona-1024.png con: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/img/triburba-icona-1024.png
  adaptive_icon_background: "#120D0B"
  adaptive_icon_foreground: assets/icona-adattiva.png
  remove_alpha_ios: true
